services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "1"]
    volumes:
      - mongo_data:/data/db
    networks:
      - studio

  api:
    image: ${API_IMAGE:-studio-api:prod}
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      # dotenv in the app reads a file; Compose env_file alone is not enough
      - ../.env:/app/.env:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - mongo
    networks:
      - studio

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - studio

networks:
  studio:

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
